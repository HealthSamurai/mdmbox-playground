services:
  # Select MDMbox 2609 for continuous matching and paginated JSON results.
  mdmbox:
    image: healthsamurai/mdmbox:2609
    # Licenses come from ../.env or the shell. Unset ones are not passed, and
    # the license is activated in the browser instead.
    environment:
      - MDMBOX_LICENSE
      - MDMBOX_ADMIN_ID=mdmbox-admin
      - MDMBOX_ADMIN_PASSWORD=password

  aidbox:
    environment:
      - AIDBOX_LICENSE
